<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Dialer & Call Replica</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden; /* Prevents unwanted browser scrollbars */
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop Responsive Wrapper: Automatically scales down the frame to fit standard laptop/PC heights */
    .viewport-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 95vh; /* Ensures it never goes over 95% of your browser window height */
    }

    @media (max-height: 860px) {
      .viewport-wrapper {
        transform: scale(0.85); /* Smoothly shrinks the entire phone layout on smaller PC screens */
      }
    }

    @media (max-height: 740px) {
      .viewport-wrapper {
        transform: scale(0.75); /* Shrinks it a bit more for lower resolution displays */
      }
    }

    /* Phone container */
    .phone {
      width: 375px;
      height: 812px;
      background: #fff;
      border-radius: 44px;
      box-shadow: 0 0 30px rgba(255,255,255,0.1);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Shared Status Bar Base Class */
    .status-bar-base {
      height: 44px;
      padding: 0 32px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .status-time-asset {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .status-icons-asset {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-5g-asset {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .battery-icon-asset {
      width: 24px;
      height: 12px;
      border-radius: 3px;
      padding: 1px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .battery-level-asset {
      width: 100%;
      height: 100%;
      border-radius: 1.5px;
    }

    .battery-icon-asset::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 3.5px;
      width: 2px;
      height: 4px;
      border-radius: 0 1px 1px 0;
    }

    /* --- DIALER SCREEN STYLES --- */
    #dialerScreen {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #fff;
    }

    .status-bar-light { background: #fff; }
    .status-bar-light .status-time-asset { color: #000; }
    .status-bar-light .status-5g-asset { color: #000; }
    .status-bar-light .battery-icon-asset { border: 1px solid #000; }
    .status-bar-light .battery-level-asset { background: #000; }
    .status-bar-light .battery-icon-asset::after { background: #000; }

    #phoneNumber {
      width: 100%;
      height: 60px;
      font-size: 38px;
      text-align: center;
      border: none;
      outline: none;
      background: transparent;
      margin-top: 30px;
      margin-bottom: 20px;
      font-weight: 400;
      color: #000;
      letter-spacing: 0.5px;
    }

    .keypad-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 20px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: 28px;
      row-gap: 16px;
    }

    .key {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #e5e5ea;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background 0.1s ease;
      padding: 0;
    }
    .key:active { background: #b0b0b5; }
    .key-num { font-size: 36px; font-weight: 400; color: #000; line-height: 1; }
    .key-num.special { font-size: 42px; margin-top: -4px; }
    .letters { font-size: 10px; font-weight: 700; color: #000; letter-spacing: 1.5px; margin-top: -1px; text-indent: 1.5px; }

    .call-row {
      margin-top: 24px;
      width: 290px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    #callBtn { grid-column: 2; width: 78px; height: 78px; border-radius: 50%; background: #34c759; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    #callBtn:active { background: #248a3d; }
    .backspace-btn { grid-column: 3; justify-self: center; background: transparent; border: none; cursor: pointer; padding: 10px; display: none; }
    .backspace-btn svg { fill: #8e8e93; width: 28px; height: 28px; }

    .tab-bar { background: #f9f9f9; border-top: 0.5px solid #b2b2b2; display: flex; justify-content: space-around; padding-top: 6px; padding-bottom: 24px; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #8e8e93; cursor: pointer; }
    .tab svg { width: 24px; height: 24px; margin-bottom: 3px; fill: #8e8e93; }
    .tab.active { color: #007aff; }
    .tab.active svg { fill: #007aff; }


    /* --- IN-CALL SCREEN STYLES --- */
    #callScreen {
      display: none;
      flex-direction: column;
      height: 100%;
      background: linear-gradient(to bottom, #1c2e35 0%, #0f171a 100%);
      color: #fff;
    }

    .status-bar-dark { background: transparent; }
    .status-bar-dark .status-time-asset { color: #fff; }
    .status-bar-dark .status-5g-asset { color: #fff; }
    .status-bar-dark .battery-icon-asset { border: 1px solid #fff; }
    .status-bar-dark .battery-level-asset { background: #fff; }
    .status-bar-dark .battery-icon-asset::after { background: #fff; }

    .caller-info {
      text-align: center;
      margin-top: 50px;
    }
    .caller-name { font-size: 32px; font-weight: 400; margin-bottom: 6px; color: #fff; }
    .call-duration { font-size: 16px; font-weight: 400; opacity: 0.6; font-variant-numeric: tabular-nums; color: #fff; }

    .call-menu-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 60px;
    }

    .call-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: 35px;
      row-gap: 30px;
      margin-bottom: 70px;
    }

    .menu-item { display: flex; flex-direction: column; align-items: center; width: 75px; }
    .menu-btn { width: 72px; height: 72px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; margin-bottom: 8px; transition: background 0.1s; }
    .menu-btn svg { width: 28px; height: 28px; fill: #fff; }
    .menu-btn:active { background: rgba(255, 255, 255, 0.25); }
    .menu-btn.active-state { background: #fff !important; }
    .menu-btn.active-state svg { fill: #000 !important; }
    .menu-label { font-size: 12px; font-weight: 400; color: #fff; opacity: 0.9; }

    #endCallBtn { width: 72px; height: 72px; border-radius: 50%; background: #ff3b30; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    #endCallBtn svg { width: 32px; height: 32px; fill: #fff; transform: rotate(135deg); }

    /* Screen Bottom bar indicator */
    .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 10px; z-index: 20; }
    #dialerScreen ~ .home-indicator { background: #000; }
    #callScreen ~ .home-indicator { background: #fff; display: none; }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <div class="phone">

      <div id="dialerScreen">
        <div class="status-bar-base status-bar-light">
          <div class="status-time-asset">2:05</div>
          <div class="status-icons-asset">
            <span class="status-5g-asset">5G</span>
            <div class="battery-icon-asset">
              <div class="battery-level-asset"></div>
            </div>
          </div>
        </div>

        <input type="text" id="phoneNumber" readonly maxlength="10" />

        <div class="keypad-container">
          <div class="keypad">
            <button class="key" onclick="press('1')"><div class="key-num" style="margin-bottom: 8px;">1</div></button>
            <button class="key" onclick="press('2')"><div class="key-num">2</div><div class="letters">ABC</div></button>
            <button class="key" onclick="press('3')"><div class="key-num">3</div><div class="letters">DEF</div></button>
            <button class="key" onclick="press('4')"><div class="key-num">4</div><div class="letters">GHI</div></button>
            <button class="key" onclick="press('5')"><div class="key-num">5</div><div class="letters">JKL</div></button>
            <button class="key" onclick="press('6')"><div class="key-num">6</div><div class="letters">MNO</div></button>
            <button class="key" onclick="press('7')"><div class="key-num">7</div><div class="letters">PQRS</div></button>
            <button class="key" onclick="press('8')"><div class="key-num">8</div><div class="letters">TUV</div></button>
            <button class="key" onclick="press('9')"><div class="key-num">9</div><div class="letters">WXYZ</div></button>
            <button class="key" onclick="press('*')"><div class="key-num special">*</div></button>
            <button class="key" onclick="press('0')"><div class="key-num">0</div><div class="letters" style="font-size: 13px; margin-top: -4px;">+</div></button>
            <button class="key" onclick="press('#')"><div class="key-num special">#</div></button>
          </div>

          <div class="call-row">
            <button id="callBtn" onclick="makeCall()">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="#fff"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.045 15.045 0 0 1-6.59-6.59l2.2-2.21a.96.96 0 0 0 .25-1A11.56 11.56 0 0 1 8.58 4c0-.55-.45-1-1-1H4.03C3.48 3 3 3.45 3 4c0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.62c0-.55-.45-1-1-1z"/></svg>
            </button>
            
            <button class="backspace-btn" id="backspaceBtn" onclick="deleteLastDigit()">
              <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
            </button>
          </div>
        </div>

        <div class="tab-bar">
          <div class="tab"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>Favorites</div>
          <div class="tab"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>Recents</div>
          <div class="tab"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>Contacts</div>
          <div class="tab active">
            <svg viewBox="0 0 24 24">
              <circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
              <circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/>
              <circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
            </svg>Keypad
          </div>
          <div class="tab"><svg viewBox="0 0 24 24"><path d="M19 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>Voicemail</div>
        </div>
        
        <div class="home-indicator" style="background: #000;"></div>
      </div>

      <div id="callScreen">
        <div class="status-bar-base status-bar-dark">
          <div class="status-time-asset">2:05</div>
          <div class="status-icons-asset">
            <span class="status-5g-asset">5G</span>
            <div class="battery-icon-asset">
              <div class="battery-level-asset"></div>
            </div>
          </div>
        </div>

        <div class="caller-info">
          <div class="caller-name" id="displayCallerName">Unknown</div>
          <div class="call-duration" id="callTimer">00:00</div>
        </div>

        <div class="call-menu-container">
          <div class="call-grid">
            <div class="menu-item">
              <button class="menu-btn" id="muteBtn" onclick="toggleMute()">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
              </button>
              <div class="menu-label">mute</div>
            </div>
            <div class="menu-item"><button class="menu-btn"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></button><div class="menu-label">keypad</div></div>
            <div class="menu-item"><button class="menu-btn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button><div class="menu-label">speaker</div></div>
            <div class="menu-item"><button class="menu-btn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button><div class="menu-label">add call</div></div>
            <div class="menu-item"><button class="menu-btn"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l5 5v-11l-5 5z"/></svg></button><div class="menu-label">FaceTime</div></div>
            <div class="menu-item"><button class="menu-btn"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg></button><div class="menu-label">contacts</div></div>
          </div>
          <button id="endCallBtn" onclick="endCall()"><svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.045 15.045 0 0 1-6.59-6.59l2.2-2.21a.96.96 0 0 0 .25-1A11.56 11.56 0 0 1 8.58 4c0-.55-.45-1-1-1H4.03C3.48 3 3 3.45 3 4c0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.62c0-.55-.45-1-1-1z"/></svg></button>
        </div>
        
        <div class="home-indicator" style="background: #fff; display: block;"></div>
      </div>
    </div>
  </div>

  <audio id="dialSound" src="Dial.mp3"></audio>
  <audio id="outOfService" src="OutOfService.mp3"></audio>
  <audio id="caller" src="Caller.mp3"></audio>

  <script>
    let timerInterval = null;
    let totalSeconds = 0;
    let activeAudio = null;

    function updateBackspaceVisibility() {
      const input = document.getElementById("phoneNumber");
      const backspaceBtn = document.getElementById("backspaceBtn");
      backspaceBtn.style.display = input.value.length > 0 ? "block" : "none";
    }

    function press(num) {
      const input = document.getElementById("phoneNumber");
      if (input.value.length < 10) {
        input.value += num;
        document.getElementById("dialSound").currentTime = 0;
        document.getElementById("dialSound").play();
        updateBackspaceVisibility();
      }
    }

    function deleteLastDigit() {
      const input = document.getElementById("phoneNumber");
      input.value = input.value.slice(0, -1);
      updateBackspaceVisibility();
    }

    function makeCall() {
      const number = document.getElementById("phoneNumber").value;
      if (!number) return;

      const dialerScreen = document.getElementById("dialerScreen");
      const callScreen = document.getElementById("callScreen");
      const nameDisplay = document.getElementById("displayCallerName");

      if (number === "4025123146") {
        nameDisplay.innerText = "Allan Andrew D.";
        activeAudio = document.getElementById("caller");
      } else {
        nameDisplay.innerText = number;
        activeAudio = document.getElementById("outOfService");
      }

      dialerScreen.style.display = "none";
      callScreen.style.display = "flex";

      if (activeAudio) {
        activeAudio.currentTime = 0;
        activeAudio.play();
        activeAudio.onended = () => { endCall(); };
      }
      startTimer();
    }

    function startTimer() {
      totalSeconds = 0;
      document.getElementById("callTimer").innerText = "00:00";
      timerInterval = setInterval(() => {
        totalSeconds++;
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;
        document.getElementById("callTimer").innerText = `${minutes < 10 ? "0" + minutes : minutes}:${seconds < 10 ? "0" + seconds : seconds}`;
      }, 1000);
    }

    function endCall() {
      clearInterval(timerInterval);
      if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; activeAudio = null; }

      const dialerScreen = document.getElementById("dialerScreen");
      const callScreen = document.getElementById("callScreen");

      callScreen.style.display = "none";
      dialerScreen.style.display = "flex";

      document.getElementById("phoneNumber").value = "";
      updateBackspaceVisibility();
      document.getElementById("muteBtn").classList.remove("active-state");
    }

    function toggleMute() { document.getElementById("muteBtn").classList.toggle("active-state"); }
  </script>
</body>
</html>
