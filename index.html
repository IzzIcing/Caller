<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Caller</title>
  <style>
    body {
      background: black;
      font-family: sans-serif;
      text-align: center;
      color: white;
    }
    .phone {
      margin: 40px auto;
      width: 300px;
      padding: 20px;
      border-radius: 40px;
      background: #111;
      box-shadow: 0 0 25px rgba(0,255,0,0.4);
    }
    #phoneNumber {
      width: 260px;
      margin: 10px auto 20px;
      font-size: 24px;
      text-align: center;
      background: black;
      color: lime;
      border: none;
      outline: none;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      gap: 15px;
      justify-content: center;
    }
    .key {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #222;
      border: 2px solid #555;
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .letters {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }
    .key:hover {
      background: #333;
    }
    #callBtn {
      margin-top: 25px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: green;
      color: white;
      font-size: 26px;
      border: none;
      cursor: pointer;
    }
    #callBtn:hover {
      background: darkgreen;
    }
    #clearBtn {
      margin-top: 15px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: red;
      color: white;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }
    #clearBtn:hover {
      background: darkred;
    }
  </style>
</head>
<body>
  <div class="phone">
    <h2>Dial a Number</h2>
    <input type="text" id="phoneNumber" readonly maxlength="10" />
    <div class="keypad">
      <button class="key" onclick="press('1')">1<div class="letters"></div></button>
      <button class="key" onclick="press('2')">2<div class="letters">ABC</div></button>
      <button class="key" onclick="press('3')">3<div class="letters">DEF</div></button>
      <button class="key" onclick="press('4')">4<div class="letters">GHI</div></button>
      <button class="key" onclick="press('5')">5<div class="letters">JKL</div></button>
      <button class="key" onclick="press('6')">6<div class="letters">MNO</div></button>
      <button class="key" onclick="press('7')">7<div class="letters">PQRS</div></button>
      <button class="key" onclick="press('8')">8<div class="letters">TUV</div></button>
      <button class="key" onclick="press('9')">9<div class="letters">WXYZ</div></button>
      <button class="key" onclick="press('*')">*</button>
      <button class="key" onclick="press('0')">0<div class="letters">+</div></button>
      <button class="key" onclick="press('#')">#</button>
    </div>
    <button id="callBtn" onclick="makeCall()">📞</button>
    <!-- Circular Clear button -->
    <button id="clearBtn" onclick="clearNumber()">✖</button>
  </div>

  <!-- Audio files -->
  <audio id="dialSound" src="Dial.mp3"></audio>
  <!-- Updated filename to OutOfService.mp3 -->
  <audio id="outOfService" src="OutOfService.mp3"></audio>
  <audio id="caller" src="Caller.mp3"></audio>

  <script>
    function press(num) {
      const input = document.getElementById("phoneNumber");
      if (input.value.length < 10) {
        input.value += num;
        document.getElementById("dialSound").play();
      }
    }

    function makeCall() {
      const number = document.getElementById("phoneNumber").value;
      if (number === "4025123146") {
        playAndReset("caller");
      } else {
        playAndReset("outOfService");
      }
    }

    function playAndReset(audioId) {
      const audio = document.getElementById(audioId);
      audio.play();
      audio.onended = () => {
        document.getElementById("phoneNumber").value = "";
      };
    }

    function clearNumber() {
      document.getElementById("phoneNumber").value = "";
    }
  </script>
</body>
</html>
